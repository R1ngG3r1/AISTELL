<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07271e">
    <title>Sedang offline · AISTEL</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: #f3f5ee; color: #0c2b20; text-align: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { max-width: 26rem; }
        img.mascot { width: 168px; height: auto; filter: drop-shadow(0 16px 20px rgba(7, 39, 30, .22)); }
        h1 { margin: 20px 0 8px; font-size: 1.75rem; line-height: 1.2; color: #07271e; }
        p { margin: 0 auto; max-width: 22rem; line-height: 1.55; color: rgba(12, 43, 32, .68); }
        .actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button {
            font: inherit; font-weight: 600; cursor: pointer; border-radius: 12px; padding: 12px 22px;
            border: 1.5px solid #287e59; background: #287e59; color: #fff; min-height: 44px;
        }
        button:hover { background: #1e6244; border-color: #1e6244; }
        button:focus-visible { outline: 3px solid rgba(40, 126, 89, .4); outline-offset: 2px; }
        .brand { margin-top: 32px; font-size: .8rem; color: rgba(12, 43, 32, .45); }
        .status { margin-top: 14px; font-size: .85rem; min-height: 1.3em; color: #287e59; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img class="mascot" src="/dashboard/maskot.webp" alt="" width="168" height="252">
        <h1>Anda sedang offline</h1>
        <p>AISTEL membutuhkan koneksi internet untuk menampilkan pesanan dan chat terbaru Anda. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
        <div class="actions">
            <button type="button" id="retry">Coba lagi</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="brand">AISTEL · Clean Space. Better Living.</p>
    </main>

    <script>
        var status = document.getElementById('status');
        document.getElementById('retry').addEventListener('click', function () {
            status.textContent = 'Memeriksa koneksi…';
            location.reload();
        });
        // Begitu koneksi kembali, muat ulang otomatis.
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
